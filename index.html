<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Расписание БГУИР</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --button-color: var(--tg-theme-button-color, #3b82f6);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --border-color: rgba(255, 255, 255, 0.08);
            
            --lk-card-bg: linear-gradient(135deg, rgba(16, 185, 129, 0.25) 0%, rgba(5, 150, 105, 0.15) 100%);
            --lk-border: rgba(52, 211, 153, 0.4);
            --lk-color: #34d399;

            --pz-card-bg: linear-gradient(135deg, rgba(239, 68, 68, 0.25) 0%, rgba(220, 38, 38, 0.15) 100%);
            --pz-border: rgba(248, 113, 113, 0.4);
            --pz-color: #f87171;

            --lr-card-bg: linear-gradient(135deg, rgba(245, 158, 11, 0.25) 0%, rgba(217, 119, 6, 0.15) 100%);
            --lr-border: rgba(251, 191, 36, 0.4);
            --lr-color: #fbbf24;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px 16px 32px 16px;
            font-size: 15px;
            line-height: 1.4;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-top: 4px;
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            font-size: 11px;
            color: var(--hint-color);
            margin: 2px 0 0 0;
        }

        .settings-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .settings-btn:active {
            transform: scale(0.95);
        }

        .active-filters-info {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .badge-info {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 20px;
            color: var(--hint-color);
            font-weight: 500;
        }

        .day-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .day-header {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .day-title {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .day-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-color);
        }

        .day-date {
            font-size: 12px;
            color: var(--button-color);
            font-weight: 600;
        }

        .day-count {
            font-size: 12px;
            color: var(--hint-color);
            font-weight: 500;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 12px;
        }

        .lesson-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lesson-card {
            display: flex;
            gap: 12px;
            padding: 12px;
            border-radius: 14px;
            transition: all 0.2s ease;
        }

        .lesson-card.card-lk {
            background: var(--lk-card-bg);
            border: 1px solid var(--lk-border);
        }

        .lesson-card.card-pz {
            background: var(--pz-card-bg);
            border: 1px solid var(--pz-border);
        }

        .lesson-card.card-lr {
            background: var(--lr-card-bg);
            border: 1px solid var(--lr-border);
        }

        .lesson-card.skipped {
            opacity: 0.35 !important;
            background: rgba(0, 0, 0, 0.3) !important;
            border: 1px dashed rgba(255, 255, 255, 0.15) !important;
        }

        .lesson-time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 8px;
            border-radius: 10px;
            min-width: 68px;
            height: fit-content;
        }

        .lesson-time-start {
            font-size: 13px;
            font-weight: 800;
            font-family: monospace;
        }

        .lesson-time-end {
            font-size: 11px;
            font-weight: 600;
            font-family: monospace;
            color: var(--hint-color);
        }

        .lesson-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lesson-top-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .lesson-title {
            font-size: 14px;
            font-weight: 700;
        }

        .tag {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .tag-lk { background: rgba(16, 185, 129, 0.3); color: #6ee7b7; }
        .tag-pz { background: rgba(239, 68, 68, 0.3); color: #fca5a5; }
        .tag-lr { background: rgba(245, 158, 11, 0.3); color: #fde047; }
        .tag-subgroup { background: rgba(168, 85, 247, 0.25); color: #e9d5ff; }
        .tag-skip { background: rgba(255, 255, 255, 0.15); color: var(--hint-color); border: 1px solid rgba(255, 255, 255, 0.2); }

        .lesson-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 2px;
            flex-wrap: wrap;
        }

        .month-banner {
            font-size: 16px;
            font-weight: 800;
            margin: 20px 0 12px 0;
            color: #60a5fa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .month-banner::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(96, 165, 250, 0.4), transparent);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--hint-color);
            font-size: 14px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px dashed var(--border-color);
        }

        /* МОДАЛЬНОЕ ОКНО НАСТРОЕК */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-height: 85vh;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px 20px 36px 20px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
            animation: slideUp 0.3s cubic-bezier(0.1, 1, 0.1, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 800;
            margin: 0;
        }

        .close-modal-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-color);
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .settings-section {
            margin-bottom: 20px;
        }

        .settings-section label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--hint-color);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .subgroup-switch, .mode-switch {
            display: flex;
            background: rgba(0, 0, 0, 0.25);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
            border: 1px solid var(--border-color);
        }

        .subgroup-btn, .mode-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            color: var(--hint-color);
            font-weight: 600;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .subgroup-btn.active, .mode-btn.active {
            background: var(--button-color);
            color: var(--button-text);
        }

        .category-skip-group {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .category-skip-title {
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .category-skip-title.lk { color: var(--lk-color); }
        .category-skip-title.pz { color: var(--pz-color); }
        .category-skip-title.lr { color: var(--lr-color); }

        .checkbox-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 13px;
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: var(--button-color);
            cursor: pointer;
        }

        .work-gen-btn {
            width: 100%;
            background: #10b981;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        .work-output-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            color: var(--text-color);
            margin-top: 10px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 120px;
            overflow-y: auto;
            display: none;
            cursor: pointer;
        }

        .save-settings-btn {
            width: 100%;
            background: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Расписание БГУИР</h1>
            <p id="current-mode-label">Загрузка...</p>
        </div>
        <button class="settings-btn" onclick="openModal()">
            ⚙️ Настройки
        </button>
    </header>

    <div class="active-filters-info" id="active-filters-info"></div>

    <div id="schedule-container">
        <div class="empty-state">⏳ Загрузка расписания...</div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ Настройки приложения</h2>
                <button class="close-modal-btn" onclick="closeModal()">✕</button>
            </div>

            <div class="settings-section">
                <label>Подгруппа</label>
                <div class="subgroup-switch">
                    <button class="subgroup-btn active" id="sg-all" onclick="setSubgroup(0)">Все</button>
                    <button class="subgroup-btn" id="sg-1" onclick="setSubgroup(1)">1 подгр.</button>
                    <button class="subgroup-btn" id="sg-2" onclick="setSubgroup(2)">2 подгр.</button>
                </div>
            </div>

            <div class="settings-section">
                <label>Режим просмотра</label>
                <div class="mode-switch">
                    <button class="mode-btn active" id="btn-mode-single" onclick="setMode('single')">Одна неделя</button>
                    <button class="mode-btn" id="btn-mode-all" onclick="setMode('all')">Весь семестр</button>
                </div>
            </div>

            <div class="settings-section" id="month-select-section" style="display: none;">
                <label>Месяц отображения</label>
                <div class="subgroup-switch">
                    <button class="subgroup-btn active" id="m-btn-10" onclick="selectMonth(10)">Окт</button>
                    <button class="subgroup-btn" id="m-btn-11" onclick="selectMonth(11)">Ноя</button>
                    <button class="subgroup-btn" id="m-btn-12" onclick="selectMonth(12)">Дек</button>
                </div>
            </div>

            <div class="settings-section" id="week-select-section">
                <label>Активная учебная неделя шаблона</label>
                <div class="subgroup-switch">
                    <button class="subgroup-btn active" id="w-btn-1" onclick="selectWeek(1)">1</button>
                    <button class="subgroup-btn" id="w-btn-2" onclick="selectWeek(2)">2</button>
                    <button class="subgroup-btn" id="w-btn-3" onclick="selectWeek(3)">3</button>
                    <button class="subgroup-btn" id="w-btn-4" onclick="selectWeek(4)">4</button>
                </div>
            </div>

            <div class="settings-section">
                <label>Пропускаемые предметы</label>
                
                <div class="category-skip-group">
                    <div class="category-skip-title lk">📖 Лекции (ЛК)</div>
                    <div class="checkbox-list" id="list-lk"></div>
                </div>

                <div class="category-skip-group">
                    <div class="category-skip-title pz">📝 Практические (ПЗ)</div>
                    <div class="checkbox-list" id="list-pz"></div>
                </div>

                <div class="category-skip-group">
                    <div class="category-skip-title lr">💻 Лабораторные (ЛР)</div>
                    <div class="checkbox-list" id="list-lr"></div>
                </div>
            </div>

            <div class="settings-section">
                <label>График работы за выбранный месяц</label>
                <button class="work-gen-btn" onclick="generateWorkSchedule()">📋 Сгенерировать текст (выбранный месяц)</button>
                <div class="work-output-box" id="workOutputBox" onclick="copyWorkScheduleText()" title="Нажмите, чтобы скопировать"></div>
            </div>

            <button class="save-settings-btn" onclick="closeModal()">Сохранить и закрыть</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentWeek = 1;
        let viewMode = 'single';
        let currentSubgroup = 0;
        let currentMonth = 10;
        let scheduleData = {};
        
        let skippedSubjects = new Set(JSON.parse(localStorage.getItem('skipped_subjects') || '[]'));
        let categorizedSubjects = { LK: [], PZ: [], LR: [] };

        const semesterStart = new Date(2026, 9, 26);
        const semesterEnd = new Date(2026, 11, 21);
        const dayMapping = { "Понедельник": 0, "Вторник": 1, "Среда": 2, "Четверг": 3, "Пятница": 4, "Суббота": 5 };

        // Надежная загрузка JSON с защитой от кэширования
        const jsonUrl = './schedule.json';

        fetch(jsonUrl, { cache: "no-store" })
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                scheduleData = data;
                extractCategorizedSubjects();
                renderSchedule();
                updateHeaderInfo();
            })
            .catch(err => {
                console.error("Ошибка загрузки schedule.json:", err);
                document.getElementById('schedule-container').innerHTML = `
                    <div class="empty-state">
                        ⚠️ <b>Ошибка загрузки schedule.json</b><br><br>
                        Убедитесь, что файл лежит в корне вашего репозитория GitHub.
                    </div>
                `;
            });

        // Расчет времени окончания пары (85 минут)
        function calculateLessonEnd(startTimeStr) {
            const [h, m] = startTimeStr.split(':').map(Number);
            const totalMinutes = h * 60 + m + 85;
            const endH = Math.floor(totalMinutes / 60) % 24;
            const endM = totalMinutes % 60;
            return `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
        }

        function extractCategorizedSubjects() {
            const seen = { LK: new Set(), PZ: new Set(), LR: new Set() };
            categorizedSubjects = { LK: [], PZ: [], LR: [] };

            for (let w = 1; w <= 4; w++) {
                if (!scheduleData[w]) continue;
                scheduleData[w].forEach(d => {
                    d.lessons.forEach(l => {
                        const rawType = (l.type || '').toUpperCase();
                        let targetKey = '';
                        if (rawType.includes('ЛК')) targetKey = 'LK';
                        else if (rawType.includes('ПЗ')) targetKey = 'PZ';
                        else if (rawType.includes('ЛР')) targetKey = 'LR';

                        if (targetKey && !seen[targetKey].has(l.title)) {
                            seen[targetKey].add(l.title);
                            categorizedSubjects[targetKey].push(l.title);
                        }
                    });
                });
            }

            Object.keys(categorizedSubjects).forEach(k => categorizedSubjects[k].sort());
            renderCategoryCheckboxes();
        }

        function renderCategoryCheckboxes() {
            const catMap = { LK: 'list-lk', PZ: 'list-pz', LR: 'list-lr' };

            Object.keys(catMap).forEach(cat => {
                const container = document.getElementById(catMap[cat]);
                const subjects = categorizedSubjects[cat];

                if (subjects.length === 0) {
                    container.innerHTML = `<div style="font-size:12px; color:var(--hint-color); padding:4px;">Нет предметов</div>`;
                    return;
                }

                container.innerHTML = subjects.map(title => {
                    const subjectKey = `${title} (${cat})`;
                    const isChecked = skippedSubjects.has(subjectKey);
                    return `
                        <label class="checkbox-item">
                            <span>${title}</span>
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleSubjectSkip('${subjectKey}')">
                        </label>
                    `;
                }).join('');
            });
        }

        function toggleSubjectSkip(subjectKey) {
            if (skippedSubjects.has(subjectKey)) {
                skippedSubjects.delete(subjectKey);
            } else {
                skippedSubjects.add(subjectKey);
            }
            localStorage.setItem('skipped_subjects', JSON.stringify(Array.from(skippedSubjects)));
            renderSchedule();
            updateHeaderInfo();
        }

        function openModal() { document.getElementById('settingsModal').classList.add('open'); }
        function closeModal() { document.getElementById('settingsModal').classList.remove('open'); }

        function setSubgroup(sg) {
            currentSubgroup = sg;
            document.getElementById('sg-all').classList.toggle('active', sg === 0);
            document.getElementById('sg-1').classList.toggle('active', sg === 1);
            document.getElementById('sg-2').classList.toggle('active', sg === 2);
            renderSchedule();
            updateHeaderInfo();
        }

        function setMode(mode) {
            viewMode = mode;
            document.getElementById('btn-mode-single').classList.toggle('active', mode === 'single');
            document.getElementById('btn-mode-all').classList.toggle('active', mode === 'all');
            
            document.getElementById('week-select-section').style.display = (mode === 'single') ? 'block' : 'none';
            document.getElementById('month-select-section').style.display = (mode === 'all') ? 'block' : 'none';
            
            renderSchedule();
            updateHeaderInfo();
        }

        function selectWeek(weekNum) {
            currentWeek = weekNum;
            for(let i=1; i<=4; i++) {
                document.getElementById(`w-btn-${i}`).classList.toggle('active', i === weekNum);
            }
            renderSchedule();
            updateHeaderInfo();
        }

        function selectMonth(monthNum) {
            currentMonth = monthNum;
            [10, 11, 12].forEach(m => {
                const btn = document.getElementById(`m-btn-${m}`);
                if (btn) btn.classList.toggle('active', m === monthNum);
            });
            renderSchedule();
            updateHeaderInfo();
        }

        function updateHeaderInfo() {
            const modeText = viewMode === 'single' ? `Неделя №${currentWeek}` : `Месяц: ${currentMonth === 10 ? 'Октябрь' : currentMonth === 11 ? 'Ноябрь' : 'Декабрь'}`;
            const sgText = currentSubgroup === 0 ? 'Все подгруппы' : `${currentSubgroup} подгруппа`;
            
            document.getElementById('current-mode-label').innerText = `${modeText} • ${sgText}`;
            document.getElementById('active-filters-info').innerHTML = `
                <span class="badge-info">📌 ${modeText}</span>
                <span class="badge-info">👥 ${sgText}</span>
                <span class="badge-info">👁️‍🗨️ Пропускаемых: ${skippedSubjects.size}</span>
            `;
        }

        function filterLessons(lessons) {
            if (currentSubgroup === 0) return lessons;
            return lessons.filter(l => l.subgroup === 0 || l.subgroup === currentSubgroup);
        }

        function getWeekNumberForDate(targetDate) {
            const diffTime = targetDate.getTime() - semesterStart.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            if (diffDays < 0) return 1;
            const diffWeeks = Math.floor(diffDays / 7);
            return (diffWeeks % 4) + 1;
        }

        function renderDayCard(dayName, dateObj, lessons) {
            const filtered = filterLessons(lessons);
            if (filtered.length === 0) return '';

            const total = filtered.length;
            const activeCount = filtered.filter(l => {
                const rawType = (l.type || '').toUpperCase();
                let targetKey = rawType.includes('ЛК') ? 'LK' : (rawType.includes('PZ') || rawType.includes('ПЗ') ? 'PZ' : 'LR');
                return !skippedSubjects.has(`${l.title} (${targetKey})`);
            }).length;

            const exactDateStr = dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });

            return `
            <div class="day-card">
                <div class="day-header">
                    <div class="day-title">
                        <span class="day-name">📅 ${dayName}</span>
                        <span class="day-date">${exactDateStr}</span>
                    </div>
                    <div class="day-count">${activeCount}/${total} пар</div>
                </div>
                <div class="lesson-list">
                    ${filtered.map(l => {
                        const rawType = (l.type || '').toUpperCase();
                        let targetKey = rawType.includes('ЛК') ? 'LK' : (rawType.includes('PZ') || rawType.includes('ПЗ') ? 'PZ' : 'LR');
                        const subjectKey = `${l.title} (${targetKey})`;
                        const isSkipped = skippedSubjects.has(subjectKey);
                        const endTime = calculateLessonEnd(l.time);

                        return `
                        <div class="lesson-card card-${targetKey.toLowerCase()} ${isSkipped ? 'skipped' : ''}">
                            <div class="lesson-time-box">
                                <span class="lesson-time-start">${l.time}</span>
                                <span class="lesson-time-end">➔ ${endTime}</span>
                            </div>
                            <div class="lesson-info">
                                <div class="lesson-top-row">
                                    <span class="lesson-title">${l.title}</span>
                                    <span class="tag tag-${targetKey.toLowerCase()}">${l.type}</span>
                                    ${l.subgroup > 0 ? `<span class="tag tag-subgroup">${l.subgroup}п</span>` : ''}
                                    ${isSkipped ? '<span class="tag tag-skip">Пропуск</span>' : ''}
                                </div>
                                <div class="lesson-meta">
                                    ${l.room ? `<span>📍 ${l.room}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        `;
                    }).join('')}
                </div>
            </div>
            `;
        }

        // 📋 ГЕНЕРАЦИЯ ГРАФИКА РАБОТЫ
        function generateWorkSchedule() {
            let currDate = new Date(semesterStart);
            const dayOfWeek = currDate.getDay();
            const diffToMonday = currDate.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
            currDate.setDate(diffToMonday);

            let daySchedules = [];

            while (currDate <= semesterEnd) {
                const currentCalcWeek = getWeekNumberForDate(currDate);
                const weekDaysData = scheduleData[currentCalcWeek] || [];
                
                const weekMap = {};
                weekDaysData.forEach(d => { weekMap[d.day] = d.lessons; });

                const dayNamesOrder = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];

                dayNamesOrder.forEach((dayName, idx) => {
                    let lessonDate = new Date(currDate);
                    lessonDate.setDate(currDate.getDate() + idx);

                    if (lessonDate >= semesterStart && lessonDate <= semesterEnd && (lessonDate.getMonth() + 1) === currentMonth) {
                        const lessons = weekMap[dayName] || [];
                        const filtered = filterLessons(lessons);
                        
                        let activeLessons = filtered.filter(l => {
                            const rawType = (l.type || '').toUpperCase();
                            let targetKey = rawType.includes('ЛК') ? 'LK' : (rawType.includes('PZ') || rawType.includes('ПЗ') ? 'PZ' : 'LR');
                            return !skippedSubjects.has(`${l.title} (${targetKey})`);
                        });

                        let workStart = 16;
                        let workEnd = 27;

                        if (activeLessons.length > 0) {
                            let latestEndHour = 16;
                            activeLessons.forEach(l => {
                                const [h, m] = l.time.split(':').map(Number);
                                const endMinutes = h * 60 + m + 85;
                                const endHDecimal = endMinutes / 60;
                                if (endHDecimal > latestEndHour) {
                                    latestEndHour = endHDecimal;
                                }
                            });

                            // Точная привязка работы под время окончания пар:
                            // 16:55 (окончание) -> работа с 18
                            // 18:30 (окончание) -> работа с 19
                            // 20:25 (окончание) -> работа с 21
                            if (latestEndHour <= 17) {
                                workStart = 18;
                            } else if (latestEndHour <= 18.5) {
                                workStart = 19;
                            } else {
                                workStart = 21;
                            }
                        }

                        if (workEnd - workStart > 9) {
                            workEnd = workStart + 9;
                        }

                        let shiftText = "";
                        if (workEnd > workStart) {
                            let formatStart = workStart >= 24 ? workStart - 24 : workStart;
                            let formatEnd = workEnd >= 24 ? workEnd - 24 : workEnd;
                            shiftText = `${formatStart}-${formatEnd}`;
                        } else {
                            shiftText = "выходной";
                        }

                        let day = String(lessonDate.getDate()).padStart(2, '0');
                        let month = String(lessonDate.getMonth() + 1).padStart(2, '0');
                        let dateFormatted = `${day}.${month}`;
                        
                        let existing = daySchedules.find(item => item.shift === shiftText);
                        if (existing) {
                            existing.dates.push(dateFormatted);
                        } else {
                            daySchedules.push({ shift: shiftText, dates: [dateFormatted] });
                        }
                    }
                });

                currDate.setDate(currDate.getDate() + 7);
            }

            let shiftsText = daySchedules.map(item => {
                return `${item.dates.join(', ')} (${item.shift})`;
            }).join('. ');

            let finalResult = `Прошу сделать смены ${shiftsText} в связи с учёбой.`;

            if (daySchedules.length === 0) {
                finalResult = `Прошу сделать смены: нет активных дней в этом месяце.`;
            }

            const outputBox = document.getElementById('workOutputBox');
            outputBox.innerText = finalResult;
            outputBox.style.display = 'block';
        }

        function copyWorkScheduleText() {
            const text = document.getElementById('workOutputBox').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ Текст смен скопирован!");
            });
        }

        function renderSchedule() {
            const container = document.getElementById('schedule-container');

            if (viewMode === 'single') {
                const days = scheduleData[currentWeek] || [];
                let html = '';
                days.forEach(d => {
                    const dayOffset = dayMapping[d.day] || 0;
                    const dummyDate = new Date(semesterStart);
                    dummyDate.setDate(semesterStart.getDate() + (currentWeek - 1) * 7 + dayOffset);
                    html += renderDayCard(d.day, dummyDate, d.lessons);
                });
                container.innerHTML = html || `<div class="empty-state">🎉 На этой неделе пар нет!</div>`;
            } else {
                let html = `<div class="month-banner">🗓️ Месяц: ${currentMonth === 10 ? 'Октябрь 2026' : currentMonth === 11 ? 'Ноябрь 2026' : 'Декабрь 2026'}</div>`;
                
                let currDate = new Date(semesterStart);
                const dayOfWeek = currDate.getDay();
                const diffToMonday = currDate.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
                currDate.setDate(diffToMonday);

                let monthHasContent = false;

                while (currDate <= semesterEnd) {
                    const currentCalcWeek = getWeekNumberForDate(currDate);
                    const weekDaysData = scheduleData[currentCalcWeek] || [];
                    
                    const weekMap = {};
                    weekDaysData.forEach(d => { weekMap[d.day] = d.lessons; });

                    const dayNamesOrder = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
                    let weekHtml = '';

                    dayNamesOrder.forEach((dayName, idx) => {
                        let lessonDate = new Date(currDate);
                        lessonDate.setDate(currDate.getDate() + idx);

                        if (lessonDate >= semesterStart && lessonDate <= semesterEnd && (lessonDate.getMonth() + 1) === currentMonth) {
                            const lessons = weekMap[dayName] || [];
                            const cardHtml = renderDayCard(dayName, lessonDate, lessons);
                            if (cardHtml) {
                                monthHasContent = true;
                                weekHtml += cardHtml;
                            }
                        }
                    });

                    if (weekHtml) html += weekHtml;
                    currDate.setDate(currDate.getDate() + 7);
                }

                container.innerHTML = monthHasContent ? html : `<div class="empty-state">🎉 В этом месяце пар нет!</div>`;
            }
        }
    </script>
