<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Расписание БГУИР</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --button-color: var(--tg-theme-button-color, #3b82f6);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --border-color: rgba(255, 255, 255, 0.08);
            
            --lk-bg: rgba(59, 130, 246, 0.15);
            --lk-color: #60a5fa;
            --pz-bg: rgba(245, 158, 11, 0.15);
            --pz-color: #fbbf24;
            --lr-bg: rgba(16, 185, 129, 0.15);
            --lr-color: #34d399;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px 16px 32px 16px;
            font-size: 15px;
            line-height: 1.4;
        }

        /* Шапка */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-top: 4px;
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            font-size: 11px;
            color: var(--hint-color);
            margin: 2px 0 0 0;
        }

        .settings-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .settings-btn:active {
            transform: scale(0.95);
        }

        .active-filters-info {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .badge-info {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 20px;
            color: var(--hint-color);
            font-weight: 500;
        }

        /* Карточка дня */
        .day-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .day-header {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .day-title {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .day-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-color);
        }

        .day-date {
            font-size: 12px;
            color: var(--button-color);
            font-weight: 600;
        }

        .day-count {
            font-size: 12px;
            color: var(--hint-color);
            font-weight: 500;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 12px;
        }

        .lesson-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lesson-card {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .lesson-card.skipped {
            opacity: 0.45;
            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }

        .lesson-time-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 10px;
            border-radius: 10px;
            min-width: 60px;
            height: fit-content;
        }

        .lesson-time-start {
            font-size: 14px;
            font-weight: 800;
            font-family: monospace;
        }

        .lesson-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lesson-top-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .lesson-title {
            font-size: 14px;
            font-weight: 700;
        }

        .tag {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .tag-lk { background: var(--lk-bg); color: var(--lk-color); }
        .tag-pz { background: var(--pz-bg); color: var(--pz-color); }
        .tag-lr { background: var(--lr-bg); color: var(--lr-color); }
        .tag-subgroup { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
        .tag-skip { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        .lesson-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: var(--hint-color);
            margin-top: 2px;
            flex-wrap: wrap;
        }

        .week-banner {
            font-size: 15px;
            font-weight: 800;
            margin: 24px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #a855f7;
        }

        .week-banner::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(168, 85, 247, 0.4), transparent);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--hint-color);
            font-size: 14px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px dashed var(--border-color);
        }

        /* МОДАЛЬНОЕ ОКНО НАСТРОЕК */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-height: 85vh;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px 20px 36px 20px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
            animation: slideUp 0.3s cubic-bezier(0.1, 1, 0.1, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 800;
            margin: 0;
        }

        .close-modal-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-color);
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .settings-section {
            margin-bottom: 20px;
        }

        .settings-section label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--hint-color);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .subgroup-switch, .mode-switch {
            display: flex;
            background: rgba(0, 0, 0, 0.25);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
            border: 1px solid var(--border-color);
        }

        .subgroup-btn, .mode-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            color: var(--hint-color);
            font-weight: 600;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .subgroup-btn.active, .mode-btn.active {
            background: var(--button-color);
            color: var(--button-text);
        }

        /* Категории пропусков в настройках */
        .skip-categories-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .skip-category-group {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px 12px;
        }

        .skip-category-title {
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .skip-category-title.lk { color: var(--lk-color); }
        .skip-category-title.pz { color: var(--pz-color); }
        .skip-category-title.lr { color: var(--lr-color); }

        .skip-items-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .skip-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            font-size: 13px;
        }

        .skip-item input[type="checkbox"] {
            width: 18px; height: 18px;
            accent-color: var(--button-color);
            cursor: pointer;
        }

        .save-settings-btn {
            width: 100%;
            background: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Расписание БГУИР</h1>
            <p id="current-mode-label">Загрузка...</p>
        </div>
        <button class="settings-btn" onclick="openModal()">
            ⚙️ Настройки
        </button>
    </header>

    <div class="active-filters-info" id="active-filters-info"></div>

    <div id="schedule-container">
        <div class="empty-state">⏳ Загрузка расписания...</div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ Настройки приложения</h2>
                <button class="close-modal-btn" onclick="closeModal()">✕</button>
            </div>

            <div class="settings-section">
                <label>Подгруппа</label>
                <div class="subgroup-switch">
                    <button class="subgroup-btn active" id="sg-all" onclick="setSubgroup(0)">Все</button>
                    <button class="subgroup-btn" id="sg-1" onclick="setSubgroup(1)">1 подгр.</button>
                    <button class="subgroup-btn" id="sg-2" onclick="setSubgroup(2)">2 подгр.</button>
                </div>
            </div>

            <div class="settings-section">
                <label>Режим просмотра</label>
                <div class="mode-switch">
                    <button class="mode-btn active" id="btn-mode-single" onclick="setMode('single')">Одна неделя</button>
                    <button class="mode-btn" id="btn-mode-all" onclick="setMode('all')">Все 4 недели</button>
                </div>
            </div>

            <div class="settings-section" id="week-select-section">
                <label>Активная учебная неделя</label>
                <div class="subgroup-switch">
                    <button class="subgroup-btn active" id="w-btn-1" onclick="selectWeek(1)">1</button>
                    <button class="subgroup-btn" id="w-btn-2" onclick="selectWeek(2)">2</button>
                    <button class="subgroup-btn" id="w-btn-3" onclick="selectWeek(3)">3</button>
                    <button class="subgroup-btn" id="w-btn-4" onclick="selectWeek(4)">4</button>
                </div>
            </div>

            <div class="settings-section">
                <label>Пропускаемые предметы по категориям</label>
                <div class="skip-categories-container" id="skip-categories-container">
                    <!-- Заполняется динамически по категориям -->
                </div>
            </div>

            <button class="save-settings-btn" onclick="closeModal()">Сохранить и закрыть</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentWeek = 1;
        let viewMode = 'single';
        let currentSubgroup = 0;
        let scheduleData = {};
        
        let skippedSubjects = new Set(JSON.parse(localStorage.getItem('skipped_subjects') || '[]'));
        let categorizedSubjects = { LK: [], PZ: [], LR: [] };

        const semesterStart = new Date(2026, 9, 26);
        const dayMapping = { "Понедельник": 0, "Вторник": 1, "Среда": 2, "Четверг": 3, "Пятница": 4, "Суббота": 5 };

        function getDateForLesson(weekNum, dayName) {
            const dayOffset = dayMapping[dayName] || 0;
            const totalDaysOffset = (weekNum - 1) * 7 + dayOffset;
            const lessonDate = new Date(semesterStart);
            lessonDate.setDate(semesterStart.getDate() + totalDaysOffset);
            return lessonDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });
        }

        const jsonUrl = window.location.href.includes('github.io') ? './schedule.json' : 'schedule.json';

        fetch(jsonUrl)
            .then(response => {
                if (!response.ok) throw new Error('schedule.json не найден');
                return response.json();
            })
            .then(data => {
                scheduleData = data;
                extractCategorizedSubjects();
                renderSchedule();
                updateHeaderInfo();
            })
            .catch(err => {
                console.error(err);
                document.getElementById('schedule-container').innerHTML = `
                    <div class="empty-state">⚠️ Ошибка загрузки schedule.json. Проверьте репозиторий GitHub.</div>
                `;
            });

        // Сбор уникальных предметов и распределение по категориям (ЛК, ПЗ, ЛР)
        function extractCategorizedSubjects() {
            const seen = { LK: new Set(), PZ: new Set(), LR: new Set() };
            categorizedSubjects = { LK: [], PZ: [], LR: [] };

            for (let w = 1; w <= 4; w++) {
                if (!scheduleData[w]) continue;
                scheduleData[w].forEach(d => {
                    d.lessons.forEach(l => {
                        const typeKey = l.type.toUpperCase();
                        if (categorizedSubjects[typeKey] !== undefined) {
                            if (!seen[typeKey].has(l.title)) {
                                seen[typeKey].add(l.title);
                                categorizedSubjects[typeKey].push(l.title);
                            }
                        }
                    });
                });
            }

            // Сортируем предметы по алфавиту внутри каждой категории
            Object.keys(categorizedSubjects).forEach(k => categorizedSubjects[k].sort());
            renderSkipCategories();
        }

        function renderSkipCategories() {
            const container = document.getElementById('skip-categories-container');
            const catMeta = [
                { key: 'LK', label: '📖 Лекции (ЛК)', class: 'lk' },
                { key: 'PZ', label: '📝 Практические (ПЗ)', class: 'pz' },
                { key: 'LR', label: '💻 Лабораторные (ЛР)', class: 'lr' }
            ];

            let html = '';
            catMeta.forEach(cat => {
                const subjects = categorizedSubjects[cat.key];
                if (subjects.length === 0) return; // Пропускаем пустые категории

                html += `
                    <div class="skip-category-group">
                        <div class="skip-category-title ${cat.class}">${cat.label}</div>
                        <div class="skip-items-list">
                            ${subjects.map(title => {
                                const subjectKey = `${title} (${cat.key})`;
                                const isChecked = skippedSubjects.has(subjectKey);
                                return `
                                    <div class="skip-item">
                                        <span>${title}</span>
                                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleSubjectSkip('${subjectKey}')">
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html || `<div style="font-size:12px; color:var(--hint-color); text-align:center;">Нет предметов</div>`;
        }

        function toggleSubjectSkip(subjectKey) {
            if (skippedSubjects.has(subjectKey)) {
                skippedSubjects.delete(subjectKey);
            } else {
                skippedSubjects.add(subjectKey);
            }
            localStorage.setItem('skipped_subjects', JSON.stringify(Array.from(skippedSubjects)));
            renderSchedule();
            updateHeaderInfo();
        }

        function openModal() { document.getElementById('settingsModal').classList.add('open'); }
        function closeModal() { document.getElementById('settingsModal').classList.remove('open'); }

        function setSubgroup(sg) {
            currentSubgroup = sg;
            document.getElementById('sg-all').classList.toggle('active', sg === 0);
            document.getElementById('sg-1').classList.toggle('active', sg === 1);
            document.getElementById('sg-2').classList.toggle('active', sg === 2);
            renderSchedule();
            updateHeaderInfo();
        }

        function setMode(mode) {
            viewMode = mode;
            document.getElementById('btn-mode-single').classList.toggle('active', mode === 'single');
            document.getElementById('btn-mode-all').classList.toggle('active', mode === 'all');
            document.getElementById('week-select-section').style.display = (mode === 'single') ? 'block' : 'none';
            renderSchedule();
            updateHeaderInfo();
        }

        function selectWeek(weekNum) {
            currentWeek = weekNum;
            for(let i=1; i<=4; i++) {
                document.getElementById(`w-btn-${i}`).classList.toggle('active', i === weekNum);
            }
            renderSchedule();
            updateHeaderInfo();
        }

        function updateHeaderInfo() {
            const modeText = viewMode === 'single' ? `Неделя №${currentWeek}` : 'Все 4 недели';
            const sgText = currentSubgroup === 0 ? 'Все подгруппы' : `${currentSubgroup} подгруппа`;
            
            document.getElementById('current-mode-label').innerText = `${modeText} • ${sgText}`;
            document.getElementById('active-filters-info').innerHTML = `
                <span class="badge-info">📌 ${modeText}</span>
                <span class="badge-info">👥 ${sgText}</span>
                <span class="badge-info">👁️‍🗨️ Пропускаемых: ${skippedSubjects.size}</span>
            `;
        }

        function filterLessons(lessons) {
            if (currentSubgroup === 0) return lessons;
            return lessons.filter(l => l.subgroup === 0 || l.subgroup === currentSubgroup);
        }

        function buildWeekHtml(weekNum, days) {
            if (!days || days.length === 0) return `<div class="empty-state">🎉 На этой неделе пар нет!</div>`;

            let weekHasLessons = false;
            let html = days.map(d => {
                const filtered = filterLessons(d.lessons);
                if (filtered.length === 0) return '';
                
                weekHasLessons = true;
                const total = filtered.length;
                const activeCount = filtered.filter(l => !skippedSubjects.has(`${l.title} (${l.type})`)).length;
                const exactDate = getDateForLesson(weekNum, d.day);
                
                return `
                <div class="day-card">
                    <div class="day-header">
                        <div class="day-title">
                            <span class="day-name">📅 ${d.day}</span>
                            <span class="day-date">${exactDate}</span>
                        </div>
                        <div class="day-count">${activeCount}/${total} пар</div>
                    </div>
                    <div class="lesson-list">
                        ${filtered.map(l => {
                            const subjectKey = `${l.title} (${l.type})`;
                            const isSkipped = skippedSubjects.has(subjectKey);
                            return `
                            <div class="lesson-card ${isSkipped ? 'skipped' : ''}">
                                <div class="lesson-time-box">
                                    <span class="lesson-time-start">${l.time}</span>
                                </div>
                                <div class="lesson-info">
                                    <div class="lesson-top-row">
                                        <span class="lesson-title">${l.title}</span>
                                        <span class="tag tag-${l.type.toLowerCase()}">${l.type}</span>
                                        ${l.subgroup > 0 ? `<span class="tag tag-subgroup">${l.subgroup}п</span>` : ''}
                                        ${isSkipped ? '<span class="tag tag-skip">Пропуск</span>' : ''}
                                    </div>
                                    <div class="lesson-meta">
                                        ${l.room ? `<span>📍 ${l.room}</span>` : ''}
                                    </div>
                                </div>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `}).join('');

            return weekHasLessons ? html : `<div class="empty-state">🎉 Для выбранной подгруппы пар на этой неделе нет!</div>`;
        }

        function renderSchedule() {
            const container = document.getElementById('schedule-container');
            if (viewMode === 'single') {
                container.innerHTML = buildWeekHtml(currentWeek, scheduleData[currentWeek] || []);
            } else {
                let html = '';
                for (let w = 1; w <= 4; w++) {
                    html += `<div class="week-banner">📌 Учебная неделя №${w}</div>`;
                    html += buildWeekHtml(w, scheduleData[w] || []);
                }
                container.innerHTML = html;
            }
        }
    </script>
</body>
</html>
